server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location = /health { proxy_pass http://api:8000/health; }
    location = /ready { proxy_pass http://api:8000/ready; }
    location = /metrics { proxy_pass http://api:8000/metrics; }
    location /docs { proxy_pass http://api:8000; }
    location /openapi.json { proxy_pass http://api:8000; }
    location /redoc { proxy_pass http://api:8000; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
